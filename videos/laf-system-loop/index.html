<!DOCTYPE html>
<html lang="en" data-resolution="square">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face{font-family:Pretendard;src:url("assets/pretendard-variable.woff2") format("woff2");font-weight:100 900}
    *{box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:transparent}
    body{font-family:Pretendard,Arial,sans-serif;color:#f8fafc}
    #stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:transparent}
    .code-scene{position:absolute;inset:0;overflow:hidden}
    .meta{position:absolute;top:44px;left:48px;right:48px;display:flex;justify-content:space-between;font:650 15px/1 monospace;letter-spacing:.14em}
    .frame-rule{position:absolute;background:rgb(248 250 252/.58);transform-origin:left center}
    .frame-rule.top{top:106px;left:48px;width:984px;height:2px}
    .frame-rule.side{top:106px;bottom:48px;left:48px;width:2px;transform-origin:center top}
    .code{position:absolute;top:178px;left:104px;width:872px;font:560 39px/1.52 monospace;letter-spacing:-.025em;white-space:nowrap}
    .code-line{display:block;width:max-content;max-width:100%;opacity:0}
    .indent-1{padding-left:45px}.indent-2{padding-left:90px}
    .tag{color:#bfdbfe}.attr{color:#f8fafc}.value{color:#93c5fd}.text{color:#f8fafc}
    .cursor{display:inline-block;width:22px;height:39px;margin-left:12px;vertical-align:-5px;background:#f8fafc;opacity:0}
    .execute{position:absolute;left:104px;right:48px;bottom:82px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:26px;font:650 16px/1 monospace;letter-spacing:.16em;opacity:0}
    .execute-track{height:2px;background:rgb(248 250 252/.45);position:relative;overflow:hidden}
    .execute-progress{position:absolute;inset:0;background:#f8fafc;transform:scaleX(0);transform-origin:left center}
    .execute-cursor{width:22px;height:22px;background:#f8fafc;opacity:0}
    .render-grid{position:absolute;inset:0;opacity:0}
    .render-grid i{position:absolute;display:block;background:rgb(248 250 252/.56)}
    .render-grid .x1{left:48px;right:48px;top:106px;height:2px;transform-origin:left center}
    .render-grid .x2{left:48px;right:48px;bottom:74px;height:2px;transform-origin:right center}
    .render-grid .y1{top:106px;bottom:74px;left:48px;width:2px;transform-origin:center top}
    .render-grid .y2{top:106px;bottom:74px;right:48px;width:2px;transform-origin:center bottom}
    .surface{position:absolute;inset:0;background:#2563eb;transform-origin:left center;opacity:0}
    .lockup{position:absolute;inset:0;color:#f8fafc;opacity:0}
    .lockup h1{position:absolute;top:42px;left:43px;font-size:330px;font-weight:850;line-height:.72;letter-spacing:-.11em;margin:0;transform:translateX(-.055em)}
    .lockup-meta{position:absolute;left:48px;right:48px;bottom:45px;display:flex;justify-content:space-between;font:650 15px/1 monospace;letter-spacing:.14em}
  </style>
</head>
<body>
  <div data-hf-id="hf-stage" id="stage" class="clip" data-composition-id="laf-system" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1080" data-track-index="0">
    <div data-hf-id="hf-code-scene" class="code-scene">
      <div data-hf-id="hf-code-meta" class="meta"><span>LAF / BUILD 001</span><span>HTML / READY</span></div>
      <i data-hf-id="hf-rule-top" class="frame-rule top" data-layout-ignore></i>
      <i data-hf-id="hf-rule-side" class="frame-rule side" data-layout-ignore></i>
      <div data-hf-id="hf-code" class="code" aria-label="HTML that builds the final LAF frame">
        <span data-hf-id="hf-line-1" id="code-line-1" class="code-line"><span class="tag">&lt;main</span> <span class="attr">class=</span><span class="value">&quot;laf&quot;</span><span class="tag">&gt;</span></span>
        <span data-hf-id="hf-line-2" class="code-line indent-1"><span class="tag">&lt;h1&gt;</span><span class="text">LAF</span><span class="tag">&lt;/h1&gt;</span></span>
        <span data-hf-id="hf-line-3" class="code-line indent-1"><span class="tag">&lt;footer&gt;</span></span>
        <span data-hf-id="hf-line-4" class="code-line indent-2"><span class="tag">&lt;span&gt;</span><span class="text">SOFTWARE</span><span class="tag">&lt;/span&gt;</span></span>
        <span data-hf-id="hf-line-5" class="code-line indent-2"><span class="tag">&lt;span&gt;</span><span class="text">SEOUL / KR</span><span class="tag">&lt;/span&gt;</span></span>
        <span data-hf-id="hf-line-6" class="code-line indent-1"><span class="tag">&lt;/footer&gt;</span></span>
        <span data-hf-id="hf-line-7" class="code-line"><span class="tag">&lt;/main&gt;</span><i data-hf-id="hf-code-cursor" class="cursor"></i></span>
      </div>
      <div data-hf-id="hf-execute" id="execute" class="execute"><span>RUN / 01</span><i class="execute-track"><b class="execute-progress"></b></i><i class="execute-cursor"></i></div>
    </div>
    <div data-hf-id="hf-render-grid" class="render-grid" data-layout-ignore>
      <i class="x1"></i><i class="x2"></i><i class="y1"></i><i class="y2"></i>
    </div>
    <div data-hf-id="hf-surface" class="surface" data-layout-ignore></div>
    <div data-hf-id="hf-lockup" id="lockup" class="lockup">
      <h1 data-hf-id="hf-lockup-title" data-layout-allow-overflow>LAF</h1>
      <div data-hf-id="hf-lockup-meta" class="lockup-meta"><span>SOFTWARE</span><span>SEOUL / KR</span></div>
    </div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    const tl=gsap.timeline({paused:true});

    tl.fromTo(".code-scene .meta",{opacity:0,y:-16},{opacity:1,y:0,duration:.34,ease:"expo.out"},.18)
      .fromTo(".frame-rule.top",{scaleX:0},{scaleX:1,duration:.52,ease:"power3.inOut"},.24)
      .fromTo(".frame-rule.side",{scaleY:0},{scaleY:1,duration:.68,ease:"power2.inOut"},.42)
      .fromTo(".code-line",{x:-34,opacity:0},{x:0,opacity:1,duration:.31,stagger:.16,ease:"power4.out"},.48)
      .fromTo(".cursor",{opacity:0},{opacity:1,duration:.12,ease:"none"},1.62)
      .to(".cursor",{opacity:.18,duration:.16,yoyo:true,repeat:2,ease:"none"},1.76)
      .fromTo(".execute",{y:22,opacity:0},{y:0,opacity:1,duration:.28,ease:"expo.out"},1.84)
      .fromTo(".execute-progress",{scaleX:0},{scaleX:1,duration:.58,ease:"power2.inOut"},2.04)
      .fromTo(".execute-cursor",{x:-720,opacity:1},{x:0,opacity:1,duration:.58,ease:"power2.inOut"},2.04)
      .to(".code-line",{x:44,opacity:0,duration:.3,stagger:.025,ease:"power3.in"},2.54)
      .to(".code-scene .meta, .frame-rule, .execute",{opacity:0,duration:.25,ease:"power2.in"},2.62)
      .fromTo(".render-grid",{opacity:0},{opacity:1,duration:.01,ease:"none"},2.78)
      .fromTo(".render-grid .x1",{scaleX:0},{scaleX:1,duration:.42,ease:"expo.out"},2.8)
      .fromTo(".render-grid .y2",{scaleY:0},{scaleY:1,duration:.36,ease:"power3.out"},2.9)
      .fromTo(".render-grid .x2",{scaleX:0},{scaleX:1,duration:.42,ease:"power2.out"},3.02)
      .fromTo(".render-grid .y1",{scaleY:0},{scaleY:1,duration:.34,ease:"expo.out"},3.12)
      .fromTo(".surface",{scaleX:0,opacity:1},{scaleX:1,opacity:1,duration:.64,ease:"power4.inOut"},3.2)
      .to(".render-grid",{opacity:0,duration:.2,ease:"power2.in"},3.52)
      .fromTo(".lockup",{opacity:0},{opacity:1,duration:.01,ease:"none"},3.56)
      .fromTo(".lockup h1",{x:74,opacity:0},{x:0,opacity:1,duration:.62,ease:"expo.out"},3.58)
      .fromTo(".lockup-meta",{y:24,opacity:0},{y:0,opacity:1,duration:.42,ease:"power3.out"},3.88);

    tl.seek(0);
    window.__timelines["laf-system"]=tl;
  </script>
</body>
</html>
