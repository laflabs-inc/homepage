  <style>
    @font-face{font-family:Pretendard;src:url("assets/pretendard-variable.woff2") format("woff2");font-weight:100 900}
    *{box-sizing:border-box}html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#2563eb}body{font-family:Pretendard,Arial,sans-serif;color:#f8fafc}
    #stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#2563eb}.grid{position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255/.12) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.12) 1px,transparent 1px);background-size:90px 90px}
    .field{position:absolute;inset:0}.meta{position:absolute;top:44px;left:48px;right:48px;display:flex;justify-content:space-between;font:650 15px/1 monospace;letter-spacing:.14em}
    .origin{position:absolute;left:108px;top:498px;width:96px;height:96px;border:2px solid #f8fafc;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;opacity:0}.origin i{display:block;background:#f8fafc}.origin-mark{position:absolute;left:108px;top:620px;font:650 13px/1 monospace;letter-spacing:.14em;opacity:0}
    .routes{position:absolute;inset:0;width:1080px;height:1080px;overflow:visible}.route-path{fill:none;stroke:#f8fafc;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}.route-end{position:absolute;left:634px;width:20px;height:20px;background:#f8fafc;opacity:0}.end-1{top:306px}.end-2{top:536px}.end-3{top:754px}
    .matrix{position:absolute;left:680px;top:274px;width:300px;height:544px;display:grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(3,84px);gap:146px 24px}.cell{position:relative;border:2px solid #f8fafc;opacity:0;transform-origin:center}.cell-fill{position:absolute;inset:14px;background:#f8fafc;transform:scale(0);transform-origin:center}.cell:nth-child(2n) .cell-fill{inset:25px}.matrix-frame{position:absolute;left:656px;top:250px;width:348px;height:580px;border:2px solid rgb(248 250 252/.38);opacity:0}.scan{position:absolute;left:656px;top:250px;width:348px;height:5px;background:#f8fafc;opacity:0;will-change:transform}
    .readout{position:absolute;left:108px;bottom:106px;display:grid;grid-template-columns:160px 210px;gap:26px;font:650 13px/1.6 monospace;letter-spacing:.12em;opacity:0}.readout span{padding-top:12px;border-top:2px solid rgb(248 250 252/.5)}.readout b{font-weight:650;color:#fff}
    .lockup{position:absolute;inset:0;background:#2563eb;opacity:0}.lockup h1{position:absolute;top:42px;left:43px;font-size:330px;line-height:.72;letter-spacing:-.11em;margin:0;transform:translateX(-.055em)}.lockup-meta{position:absolute;left:48px;right:48px;bottom:45px;display:flex;justify-content:space-between;font:650 15px/1 monospace;letter-spacing:.14em}
  </style>
</head>
<body>

  <script>
    window.__timelines=window.__timelines||{};
    const tl=gsap.timeline({paused:true});
    const paths=Array.from(document.querySelectorAll(".route-path"));
    paths.forEach((path)=>{const length=path.getTotalLength();gsap.set(path,{strokeDasharray:length,strokeDashoffset:length})});
    tl.fromTo(".origin",{scale:.35,opacity:0,rotation:-8},{scale:1,opacity:1,rotation:0,duration:.46,ease:"back.out(1.5)"},.2)
      .fromTo(".origin i",{scale:0,opacity:0},{scale:1,opacity:1,duration:.24,stagger:.06,ease:"power3.out"},.38)
      .fromTo(".origin-mark",{x:-28,opacity:0},{x:0,opacity:1,duration:.36,ease:"expo.out"},.52);
    paths.forEach((path,index)=>{
      const at=.68+index*.26;
      tl.to(path,{strokeDashoffset:0,duration:.58,ease:"power2.inOut"},at)
        .fromTo(`.end-${index+1}`,{scale:0,opacity:0},{scale:1,opacity:1,duration:.22,ease:"back.out(2)"},at+.48)
        .fromTo(`.cell:nth-child(n+${index*3+1}):nth-child(-n+${index*3+3})`,{x:70,scale:.55,opacity:0},{x:0,scale:1,opacity:1,duration:.42,stagger:.07,ease:"power4.out"},at+.52)
        .fromTo(`.cell:nth-child(n+${index*3+1}):nth-child(-n+${index*3+3}) .cell-fill`,{scale:0},{scale:1,duration:.28,stagger:.05,ease:"power3.out"},at+.72)
    });
    tl.fromTo(".matrix-frame",{scale:.92,opacity:0},{scale:1,opacity:1,duration:.48,ease:"power3.out"},1.72)
      .fromTo(".readout",{y:24,opacity:0},{y:0,opacity:1,duration:.46,ease:"expo.out"},1.86)
      .fromTo(".scan",{y:0,opacity:0},{y:575,opacity:.82,duration:.72,ease:"power1.inOut"},2.14)
      .to(".scan",{opacity:0,duration:.12,ease:"power2.in"},2.87)
      .to(".field",{x:-220,opacity:0,duration:.5,ease:"power4.in"},3.05)
      .fromTo(".lockup",{x:1080,opacity:1},{x:0,opacity:1,duration:.72,ease:"power4.out"},3.22)
      .fromTo(".lockup h1",{x:80,opacity:0},{x:0,opacity:1,duration:.6,ease:"power3.out"},3.48)
      .fromTo(".lockup-meta",{opacity:0},{opacity:1,duration:.35,ease:"power2.out"},4.15);
    tl.seek(0);window.__timelines["laf-system"]=tl;
  </script>
